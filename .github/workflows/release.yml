name: Release

# Push a tag like v1.2.0 → this builds brn-webhooks.zip (folder brn-webhooks/ inside, as WordPress
# expects) and publishes a GitHub release. Sites running the plugin pick it up through the built-in
# GitHub updater (and install it automatically when "Automatic updates" is on).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^\s*\*\s*Version:' brn-webhooks.php | head -1 | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -E "define\( 'BRNWH_VERSION'" brn-webhooks.php | sed -E "s/.*'BRNWH_VERSION', '([^']+)'.*/\1/")
          echo "tag=$TAG header=$HEADER constant=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG does not match Version header ($HEADER) and BRNWH_VERSION ($CONST) in brn-webhooks.php"
            exit 1
          fi

      - name: Lint PHP
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build zip
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=brn-webhooks/ -o dist/brn-webhooks.zip HEAD
          unzip -l dist/brn-webhooks.zip | tail -3

      - name: Release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '
            /^## / { if (found) exit; if (index($0, v) > 0) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/brn-webhooks.zip \
            --title "BRN Webhooks ${GITHUB_REF_NAME}" \
            --notes-file notes.md
